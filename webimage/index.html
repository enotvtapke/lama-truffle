<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lama Sandbox (Truffle interpreter in WebAssembly)</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem;
         display: grid; grid-template-rows: auto auto 1fr auto auto; gap: .5rem; height: 100vh; box-sizing: border-box; }
  h1 { font-size: 1.1rem; margin: 0; }
  #status { font-size: .85rem; opacity: .8; }
  label { font-size: .8rem; opacity: .7; display: block; margin-bottom: .15rem; }
  textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace;
             font-size: 13px; padding: .5rem; resize: vertical; }
  #code { min-height: 11rem; }
  #stdin { min-height: 3rem; }
  #out { background: #111; color: #b9f5b9; font-family: ui-monospace, monospace; font-size: 13px;
         white-space: pre-wrap; padding: .6rem; border-radius: 4px; overflow: auto; margin: 0; min-height: 5rem; }
  button { font-size: 14px; padding: .4rem 1rem; cursor: pointer; }
  .row { display: flex; gap: .5rem; align-items: center; }
</style>
</head>
<body>
  <h1>Lama Sandbox <small style="opacity:.6">— Truffle interpreter compiled to WebAssembly</small></h1>
  <div class="row">
    <button id="run" disabled>Run ▶</button>
    <span id="status">Loading WebAssembly runtime…</span>
  </div>
  <div>
    <label for="code">Program (imports from the standard library work, e.g. <code>import List;</code>)</label>
    <textarea id="code" spellcheck="false">import List;

fun sumList (l) {
  foldl (fun (acc, x) { acc + x }, 0, l)
}

var a = read();
var b = read();
write (sumList ({a, b, a * b}))</textarea>
  </div>
  <div>
    <label for="stdin">Standard input (one value per line, consumed by <code>read()</code>)</label>
    <textarea id="stdin" spellcheck="false">3
4</textarea>
  </div>
  <pre id="out"></pre>

  <script src="lama.js"></script>
  <script>
    const statusEl = document.getElementById('status');
    const outEl = document.getElementById('out');
    const runBtn = document.getElementById('run');
    const codeEl = document.getElementById('code');

    // lama.js auto-runs main() on load, which installs globalThis.runLama.
    // Poll until it is available, then enable the UI.
    (function waitReady(tries) {
      if (typeof globalThis.runLama === 'function') {
        statusEl.textContent = 'Ready. Edit a Lama program and press Run.';
        runBtn.disabled = false;
        if (new URLSearchParams(location.search).get('test') === '1') runProgram();
        return;
      }
      if (tries <= 0) { statusEl.textContent = 'Failed to initialize runtime.'; return; }
      setTimeout(() => waitReady(tries - 1), 100);
    })(200);

    function runProgram() {
      outEl.textContent = '';
      statusEl.textContent = 'Running…';
      try {
        globalThis.setLamaInput(document.getElementById('stdin').value);
        const result = globalThis.runLama(codeEl.value);
        outEl.textContent = String(result);
        statusEl.textContent = 'Done.';
        console.log('SANDBOX_RESULT_BEGIN\n' + String(result) + '\nSANDBOX_RESULT_END');
      } catch (e) {
        outEl.textContent = 'JS error: ' + e;
        statusEl.textContent = 'Error.';
      }
    }
    runBtn.addEventListener('click', runProgram);
  </script>
</body>
</html>
